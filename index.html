<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJ COIN APP</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="room">
        <div class="led-top"></div>
        <div class="led-left"></div>
        <div class="led-right"></div>
        
        <div class="sidebar">
            <div class="header-row">
                <div class="stats">
                    <h2>$<span id="balance">0.00</span></h2>
                </div>
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </div>
            
            <button class="add-coin-btn" id="addCoinBtn" onclick="addNewCoin()">+ Add Coin <span style="color: white;">(</span><span style="color: #4ade80;">$10000</span><span style="color: white;">)</span></button>

            <div class="coin-selector-header" id="selectedCoinHeader">Selected: Coin #1</div>
            
            <div class="stats-grid">
                <div><strong>Total Rolls:</strong> <span id="totalRolls">0</span></div>
                <div><strong>Heads Chance:</strong> <span id="chanceDisplay">10.0</span>%</div>
                <div><strong>Coin Value:</strong> $<span id="valueDisplay">0.01</span></div>
                <div><strong>Flip Time:</strong> <span id="timeDisplay">3.0</span>s</div>
            </div>
            
            <div class="upgrades">
                <button class="upgrade-btn" id="chanceBtn" onclick="upgradeChance()">Chance</button>
                <button class="upgrade-btn" id="valueBtn" onclick="upgradeValue()">Value</button>
                <button class="upgrade-btn" id="timeBtn" onclick="upgradeTime()">Time</button>
            </div>

            <div class="history-container">
                <h3>Roll History</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>

        <div class="table" id="table"></div>

        <div class="btn-wrapper">
            <button class="flip-btn" id="flipBtn" onclick="flipAllCoins()">FLIP</button>
        </div>

        <div class="settings-modal" id="settingsModal">
            <h1>Settings & Info</h1>
            
            <!-- Google Sign-In Section Inside Settings -->
            <h2>Cloud Account</h2>
            <div style="margin-bottom: 30px;">
                <button id="googleSignInBtn" class="google-btn" onclick="loginWithGoogle()">Sign In with Google</button>
                <div id="userProfile" style="display: none; align-items: center; gap: 15px;">
                    <img id="userAvatar" src="" alt="Avatar" style="width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--theme);">
                    <div>
                        <div id="userName" style="font-weight: 700; font-size: 16px;"></div>
                        <button class="reset-btn" onclick="logoutGoogle()" style="padding: 6px 14px; font-size: 12px; margin-top: 5px;">Sign Out</button>
                    </div>
                </div>
            </div>

            <h2>Theme Color</h2>
            <div class="color-grid">
                <div class="color-swatch" style="background: #8a2be2;" onclick="setTheme('#8a2be2')"></div>
                <div class="color-swatch" style="background: #008B8B;" onclick="setTheme('#008B8B')"></div>
                <div class="color-swatch" style="background: #e63946;" onclick="setTheme('#e63946')"></div>
                <div class="color-swatch" style="background: #4361ee;" onclick="setTheme('#4361ee')"></div>
                <div class="color-swatch" style="background: #2a9d8f;" onclick="setTheme('#2a9d8f')"></div>
                <div class="color-swatch" style="background: #e9c46a;" onclick="setTheme('#e9c46a')"></div>
                <div class="color-swatch" style="background: #ffffff;" onclick="setTheme('#ffffff')"></div>
            </div>

            <div class="action-row">
                <button class="save-btn" onclick="saveGame()">💾 Save Game</button>
                <button class="reset-btn" onclick="resetProgress()">⚠️ Reset All Progress</button>
            </div>
            
            <p id="saveMsg" style="color: #2a9d8f; font-weight: bold; display: none;">Game Saved Successfully!</p>

            <button class="close-settings" onclick="toggleSettings()">Close Settings</button>
        </div>
    </div>

    <!-- Note: Make sure app.js is inside your js/ folder or adjust path to match your layout -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
