<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --theme: #8a2be2;
            --theme-text: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        /* Room */
        .room {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.03) 0%, transparent 70%),
                repeating-linear-gradient(45deg, #0a0a0a 0, #0a0a0a 2px, transparent 2px, transparent 15px),
                repeating-linear-gradient(-45deg, #0a0a0a 0, #0a0a0a 2px, transparent 2px, transparent 15px);
        }

        .led-top, .led-left, .led-right {
            position: absolute;
            background: #fff;
            box-shadow: 0 0 20px #fff, 0 0 40px #fff;
            z-index: 0;
        }

        .led-top { top: 0; left: 0; width: 100%; height: 8px; }
        .led-left { top: 0; left: 0; width: 8px; height: 100%; }
        .led-right { top: 0; right: 0; width: 8px; height: 100%; }

        .table {
            width: 100%;
            height: 35%;
            background: linear-gradient(to top, #020202, #111111);
            border-top: 2px solid #222;
            position: relative;
            z-index: 1;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
            gap: 20px;
            box-sizing: border-box;
            padding-right: 380px; /* Make room for sidebar */
        }

        /* Coin Mechanics */
        .coin-wrapper {
            perspective: 1000px;
            z-index: 5;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .coin-wrapper.selected {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 30px var(--theme);
        }

        .coin {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg);
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 15px 25px rgba(0,0,0,0.9);
            border: 2px solid #333;
        }

        .coin-back {
            transform: rotateX(180deg);
        }

        /* UI Elements */
        .btn-wrapper {
            position: absolute;
            bottom: 40px;
            left: calc(50% - 190px);
            transform: translateX(-50%);
            width: 180px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 25px var(--theme);
            z-index: 5;
        }

        .btn-wrapper::before {
            content: '';
            position: absolute;
            width: 250%;
            height: 250%;
            background: conic-gradient(transparent, transparent, transparent, var(--theme));
            animation: rotateLight 2s linear infinite;
        }

        .btn-wrapper::after {
            content: '';
            position: absolute;
            inset: 5px;
            background: #0a0a0a;
            border-radius: 8px;
        }

        .flip-btn {
            position: relative;
            z-index: 1;
            background: transparent;
            color: white;
            font-size: 32px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            border: none;
            cursor: pointer;
            letter-spacing: 4px;
            width: 100%;
            height: 100%;
        }

        @keyframes rotateLight { 100% { transform: rotate(360deg); } }

        .sidebar {
            position: absolute;
            right: 0;
            top: 0;
            width: 380px;
            height: 100%;
            background: rgba(8, 8, 8, 0.98);
            border-left: 3px solid var(--theme);
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            z-index: 10;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .stats h2 {
            color: var(--theme);
            margin: 0;
            font-size: 36px;
        }

        .coin-selector-header {
            color: var(--theme);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            padding: 5px;
            background: #111;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .upgrades {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .upgrade-btn, .add-coin-btn {
            background: #151515;
            color: white;
            border: 2px solid var(--theme);
            padding: 12px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            transition: 0.2s;
        }

        .add-coin-btn {
            background: var(--theme);
            color: var(--theme-text);
            margin-bottom: 15px;
        }

        .upgrade-btn:hover, .add-coin-btn:hover { filter: brightness(1.2); }
        .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .history-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .history-container h3 {
            color: var(--theme);
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 14px;
            color: #ccc;
            background: #080808;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .history-item {
            padding: 6px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        /* Settings Modal */
        .settings-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 24px;
            cursor: pointer;
        }

        .settings-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 20;
            flex-direction: column;
            padding: 50px;
            box-sizing: border-box;
        }

        .settings-modal.open { display: flex; }
        .settings-modal h1 { color: var(--theme); }

        .color-grid {
            display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 30px;
        }

        .color-swatch {
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; border: 2px solid #fff;
        }

        .action-row {
            display: flex; gap: 20px; margin-top: 20px;
        }

        .save-btn {
            background: #2a9d8f; color: white; border: none; padding: 12px 20px;
            font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px;
        }

        .reset-btn {
            background: #ff4444; color: white; border: none; padding: 12px 20px;
            font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px;
        }

        .close-settings {
            margin-top: auto; background: var(--theme); color: var(--theme-text); border: none;
            padding: 15px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="room">
        <div class="led-top"></div>
        <div class="led-left"></div>
        <div class="led-right"></div>
        
        <div class="sidebar">
            <div class="header-row">
                <div class="stats">
                    <h2>$<span id="balance">0.00</span></h2>
                </div>
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </div>
            
            <button class="add-coin-btn" id="addCoinBtn" onclick="addNewCoin()">+ Add Another Coin (Free)</button>

            <div class="coin-selector-header" id="selectedCoinHeader">Selected: Coin #1</div>
            
            <div class="stats-grid">
                <div><strong>Total Rolls:</strong> <span id="totalRolls">0</span></div>
                <div><strong>Heads Chance:</strong> <span id="chanceDisplay">10.0</span>%</div>
                <div><strong>Coin Value:</strong> $<span id="valueDisplay">0.01</span></div>
                <div><strong>Flip Time:</strong> <span id="timeDisplay">3.0</span>s</div>
            </div>
            
            <div class="upgrades">
                <button class="upgrade-btn" onclick="upgradeChance()">Upgrade Chance</button>
                <button class="upgrade-btn" onclick="upgradeValue()">Upgrade Value</button>
                <button class="upgrade-btn" onclick="upgradeTime()">Upgrade Time</button>
            </div>

            <div class="history-container">
                <h3>Roll History</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>

        <div class="table" id="table">
            <!-- Coins generated via JS -->
        </div>

        <div class="btn-wrapper">
            <button class="flip-btn" id="flipBtn" onclick="flipAllCoins()">FLIP</button>
        </div>

        <div class="settings-modal" id="settingsModal">
            <h1>Settings & Info</h1>
            
            <h2>Theme Color</h2>
            <div class="color-grid">
                <div class="color-swatch" style="background: #8a2be2;" onclick="setTheme('#8a2be2')"></div>
                <div class="color-swatch" style="background: #008B8B;" onclick="setTheme('#008B8B')"></div>
                <div class="color-swatch" style="background: #e63946;" onclick="setTheme('#e63946')"></div>
                <div class="color-swatch" style="background: #4361ee;" onclick="setTheme('#4361ee')"></div>
                <div class="color-swatch" style="background: #2a9d8f;" onclick="setTheme('#2a9d8f')"></div>
                <div class="color-swatch" style="background: #e9c46a;" onclick="setTheme('#e9c46a')"></div>
                <div class="color-swatch" style="background: #ffffff;" onclick="setTheme('#ffffff')"></div>
            </div>

            <div class="action-row">
                <button class="save-btn" onclick="saveGame()">💾 Save Game</button>
                <button class="reset-btn" onclick="resetProgress()">⚠️ Reset All Progress</button>
            </div>
            
            <p id="saveMsg" style="color: #2a9d8f; font-weight: bold; display: none;">Game Saved Successfully!</p>

            <button class="close-settings" onclick="toggleSettings()">Close Settings</button>
        </div>
    </div>

    <script>
        // Data Arrays
        const chanceTiers = [10.0, 12.5, 15.0, 17.5, 20.0, 22.5, 25.0, 27.5, 30.0, 32.5, 35.0, 37.5, 40.0, 42.5, 45.0, 47.5, 50.0, 52.5, 55.0, 57.5, 60.0, 62.5, 65.0, 67.5, 70.0, 72.5, 75.0];
        const valueTiers = [0.01, 0.05, 0.10, 0.25, 0.50, 1, 2, 5, 10, 20, 50, 100];
        const timeTiers = [3.0, 2.9, 2.8, 2.7, 2.6, 2.5, 2.4, 2.3, 2.2, 2.1, 2.0, 1.9, 1.8, 1.7, 1.6, 1.5, 1.4, 1.3, 1.2, 1.1, 1.0];

        // Realistic Wikimedia Commons Image Mapping
        function getCoinImages(value) {
            if (value >= 1.00) return { f: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Krugerrand_1oz_2017_obverse.jpg/240px-Krugerrand_1oz_2017_obverse.jpg', b: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Krugerrand_1oz_2017_reverse.jpg/240px-Krugerrand_1oz_2017_reverse.jpg' };
            if (value >= 0.50) return { f: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Kennedy_Half_Dollar_Obv_1989.png/240px-Kennedy_Half_Dollar_Obv_1989.png', b: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Kennedy_Half_Dollar_Rev_1989.png/240px-Kennedy_Half_Dollar_Rev_1989.png' };
            if (value >= 0.25) return { f: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Washington_Quarter_Obv.png/240px-Washington_Quarter_Obv.png', b: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Washington_Quarter_Rev.png/240px-Washington_Quarter_Rev.png' };
            if (value >= 0.10) return { f: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/US_Dime_Obv.png/240px-US_Dime_Obv.png', b: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/US_Dime_Rev.png/240px-US_Dime_Rev.png' };
            if (value >= 0.05) return { f: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/US_Nickel_2013_Obv.png/240px-US_Nickel_2013_Obv.png', b: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/US_Nickel_2013_Rev.png/240px-US_Nickel_2013_Rev.png' };
            return { f: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/US_One_Cent_Obv.png/240px-US_One_Cent_Obv.png', b: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/US_One_Cent_Rev.png/240px-US_One_Cent_Rev.png' };
        }

        // Global State
        let balance = 0;
        let totalRolls = 0;
        let history = [];
        let coins = [{ chanceIdx: 0, valueIdx: 0, timeIdx: 0, rotation: 0 }];
        let selectedCoinIndex = 0;
        let isFlipping = false;

        // Init
        loadGame();

        function renderCoins() {
            const table = document.getElementById('table');
            table.innerHTML = '';
            
            coins.forEach((coinData, index) => {
                const val = valueTiers[coinData.valueIdx];
                const images = getCoinImages(val);
                
                // Adjust size based on value
                let size = 100;
                if(val == 0.10) size = 85;
                if(val == 0.25) size = 110;
                if(val == 0.50) size = 120;
                if(val >= 1.00) size = 130;

                const wrapper = document.createElement('div');
                wrapper.className = `coin-wrapper ${index === selectedCoinIndex ? 'selected' : ''}`;
                wrapper.onclick = () => selectCoin(index);
                
                wrapper.innerHTML = `
                    <div class="coin" id="coin-${index}" style="width:${size}px; height:${size}px; transform: rotateX(${coinData.rotation}deg)">
                        <div class="coin-face" style="background-image: url('${images.f}')"></div>
                        <div class="coin-face coin-back" style="background-image: url('${images.b}')"></div>
                    </div>
                `;
                table.appendChild(wrapper);
            });

            document.getElementById('addCoinBtn').style.display = coins.length >= 5 ? 'none' : 'block';
            updateSidebar();
        }

        function selectCoin(index) {
            if (isFlipping) return;
            selectedCoinIndex = index;
            renderCoins();
        }

        function addNewCoin() {
            if (coins.length < 5) {
                coins.push({ chanceIdx: 0, valueIdx: 0, timeIdx: 0, rotation: 0 });
                selectedCoinIndex = coins.length - 1;
                renderCoins();
            }
        }

        function updateSidebar() {
            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('totalRolls').innerText = totalRolls;
            document.getElementById('selectedCoinHeader').innerText = `Selected: Coin #${selectedCoinIndex + 1}`;
            
            const activeCoin = coins[selectedCoinIndex];
            document.getElementById('chanceDisplay').innerText = chanceTiers[activeCoin.chanceIdx].toFixed(1);
            document.getElementById('valueDisplay').innerText = valueTiers[activeCoin.valueIdx].toFixed(2);
            document.getElementById('timeDisplay').innerText = timeTiers[activeCoin.timeIdx].toFixed(1);

            const historyContainer = document.getElementById('historyList');
            historyContainer.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerText = item;
                historyContainer.appendChild(div);
            });
        }

        function addHistory(text) {
            history.unshift(text);
            if (history.length > 10) history.pop();
            updateSidebar();
        }

        function flipAllCoins() {
            if (isFlipping) return;
            isFlipping = true;
            
            const btn = document.getElementById('flipBtn');
            btn.style.opacity = '0.5';
            btn.innerText = '...';

            let maxTime = 0;
            let totalEarned = 0;
            let headsCount = 0;
            totalRolls++;

            coins.forEach((coinData, index) => {
                const domCoin = document.getElementById(`coin-${index}`);
                const flipTimeMs = timeTiers[coinData.timeIdx] * 1000;
                if (flipTimeMs > maxTime) maxTime = flipTimeMs;

                const chance = chanceTiers[coinData.chanceIdx] / 100;
                const isHeads = Math.random() < chance;
                
                let nextRotation = coinData.rotation + 1800; // 5 spins
                if (isHeads && nextRotation % 360 !== 0) nextRotation += 180;
                if (!isHeads && nextRotation % 360 === 0) nextRotation += 180;

                domCoin.animate([
                    { transform: `translateY(0) rotateX(${coinData.rotation}deg)` },
                    { transform: `translateY(-300px) rotateX(${coinData.rotation + (nextRotation - coinData.rotation)/2}deg)` },
                    { transform: `translateY(0) rotateX(${nextRotation}deg)` }
                ], { duration: flipTimeMs, easing: 'ease-in-out' });

                setTimeout(() => {
                    domCoin.style.transform = `rotateX(${nextRotation}deg)`;
                    coinData.rotation = nextRotation;
                    if (isHeads) {
                        headsCount++;
                        totalEarned += valueTiers[coinData.valueIdx];
                    }
                }, flipTimeMs);
            });

            setTimeout(() => {
                balance += totalEarned;
                addHistory(`Roll ${totalRolls}: ${headsCount} Heads (+$${totalEarned.toFixed(2)})`);
                btn.style.opacity = '1';
                btn.innerText = 'FLIP';
                isFlipping = false;
                renderCoins();
            }, maxTime);
        }

        function upgradeChance() {
            if (coins[selectedCoinIndex].chanceIdx < chanceTiers.length - 1) {
                coins[selectedCoinIndex].chanceIdx++;
                renderCoins();
            }
        }

        function upgradeValue() {
            if (coins[selectedCoinIndex].valueIdx < valueTiers.length - 1) {
                coins[selectedCoinIndex].valueIdx++;
                renderCoins();
            }
        }

        function upgradeTime() {
            if (coins[selectedCoinIndex].timeIdx < timeTiers.length - 1) {
                coins[selectedCoinIndex].timeIdx++;
                renderCoins();
            }
        }

        function setTheme(color) {
            document.documentElement.style.setProperty('--theme', color);
            document.documentElement.style.setProperty('--theme-text', (color === '#ffffff' || color === '#e9c46a') ? '#000' : '#fff');
        }

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('open');
            document.getElementById('saveMsg').style.display = 'none';
        }

        function saveGame() {
            const saveData = { balance, totalRolls, history, coins, theme: getComputedStyle(document.documentElement).getPropertyValue('--theme').trim() };
            localStorage.setItem('coinFlipMasterSave', JSON.stringify(saveData));
            const msg = document.getElementById('saveMsg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        function loadGame() {
            const saved = localStorage.getItem('coinFlipMasterSave');
            if (saved) {
                const data = JSON.parse(saved);
                balance = data.balance || 0;
                totalRolls = data.totalRolls || 0;
                history = data.history || [];
                coins = data.coins || [{ chanceIdx: 0, valueIdx: 0, timeIdx: 0, rotation: 0 }];
                if (data.theme) setTheme(data.theme);
            }
            renderCoins();
        }

        function resetProgress() {
            if(confirm("Are you sure you want to reset ALL progress? This cannot be undone.")) {
                localStorage.removeItem('coinFlipMasterSave');
                balance = 0;
                totalRolls = 0;
                history = [];
                coins = [{ chanceIdx: 0, valueIdx: 0, timeIdx: 0, rotation: 0 }];
                selectedCoinIndex = 0;
                renderCoins();
                toggleSettings();
            }
        }
    </script>
</body>
</html>
