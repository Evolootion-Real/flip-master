<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --theme: #8a2be2;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        /* Room with Subtle Geometric Personality */
        .room {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.03) 0%, transparent 70%),
                repeating-linear-gradient(45deg, #0a0a0a 0, #0a0a0a 2px, transparent 2px, transparent 15px),
                repeating-linear-gradient(-45deg, #0a0a0a 0, #0a0a0a 2px, transparent 2px, transparent 15px);
        }

        .led-top, .led-left, .led-right {
            position: absolute;
            background: #fff;
            box-shadow: 0 0 20px #fff, 0 0 40px #fff;
            z-index: 0;
        }

        .led-top { top: 0; left: 0; width: 100%; height: 8px; }
        .led-left { top: 0; left: 0; width: 8px; height: 100%; }
        .led-right { top: 0; right: 0; width: 8px; height: 100%; }

        .table {
            width: 100%;
            height: 35%;
            background: linear-gradient(to top, #020202, #111111);
            border-top: 2px solid #222;
            position: relative;
            z-index: 1;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        /* Hyper-Realistic 3D Coin */
        .coin-container {
            position: absolute;
            left: 20%;
            top: -60px;
            perspective: 1000px;
            z-index: 5;
        }

        .coin {
            width: 130px;
            height: 130px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg);
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 55px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.7), inset 0 0 5px rgba(255,255,255,0.4), 0 15px 25px rgba(0,0,0,0.9);
            transition: background 0.3s, border 0.3s, color 0.3s;
        }

        .coin-back {
            transform: rotateX(180deg);
        }

        /* Coin Materials */
        .coin-copper {
            background: linear-gradient(135deg, #ffb380 0%, #b87333 40%, #703612 100%);
            border: 4px solid #8b4513;
            color: #3e1f04;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.3), -1px -1px 2px rgba(0,0,0,0.5);
        }

        .coin-silver {
            background: linear-gradient(135deg, #ffffff 0%, #c0c0c0 40%, #696969 100%);
            border: 4px solid #808080;
            color: #333333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8), -1px -1px 2px rgba(0,0,0,0.5);
        }

        .coin-gold {
            background: linear-gradient(135deg, #ffe55c 0%, #daa520 40%, #8b6508 100%);
            border: 4px solid #b8860b;
            color: #553a00;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6), -1px -1px 2px rgba(0,0,0,0.5);
        }

        @keyframes flipAir {
            0% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-350px) rotateX(900deg); }
            100% { transform: translateY(0) rotateX(1800deg); }
        }

        /* UI Elements */
        .btn-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40%;
            transform: translateX(-50%);
            width: 180px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 25px var(--theme);
            z-index: 5;
        }

        .btn-wrapper::before {
            content: '';
            position: absolute;
            width: 250%;
            height: 250%;
            background: conic-gradient(transparent, transparent, transparent, var(--theme));
            animation: rotateLight 2s linear infinite;
        }

        .btn-wrapper::after {
            content: '';
            position: absolute;
            inset: 5px;
            background: #0a0a0a;
            border-radius: 8px;
        }

        .flip-btn {
            position: relative;
            z-index: 1;
            background: transparent;
            color: white;
            font-size: 32px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            border: none;
            cursor: pointer;
            letter-spacing: 4px;
            width: 100%;
            height: 100%;
        }

        @keyframes rotateLight {
            100% { transform: rotate(360deg); }
        }

        .sidebar {
            position: absolute;
            right: 0;
            top: 0;
            width: 380px;
            height: 100%;
            background: rgba(8, 8, 8, 0.98);
            border-left: 3px solid var(--theme);
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            z-index: 10;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 18px;
        }

        .stats h2 {
            color: var(--theme);
            margin: 0;
            font-size: 36px;
        }

        .upgrades {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 30px 0;
        }

        .upgrade-btn {
            background: #151515;
            color: white;
            border: 2px solid var(--theme);
            padding: 15px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: 0.2s;
        }

        .upgrade-btn:hover { background: var(--theme); color: #fff; }

        .history-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
        }

        .history-container h3 {
            color: var(--theme);
            margin-bottom: 10px;
            font-size: 22px;
        }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 16px;
            color: #ccc;
            background: #080808;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        /* Settings Modal */
        .settings-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 24px;
            cursor: pointer;
        }

        .settings-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 20;
            flex-direction: column;
            padding: 50px;
            box-sizing: border-box;
        }

        .settings-modal.open { display: flex; }

        .settings-modal h1 { color: var(--theme); }

        .info-box {
            background: #111; padding: 20px; border: 1px solid #333;
            border-radius: 8px; margin-bottom: 30px; font-size: 18px; line-height: 1.6;
        }

        .color-grid {
            display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 30px;
        }

        .color-swatch {
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; border: 2px solid #fff;
        }

        .danger-zone {
            margin-top: 20px; padding: 20px; border: 1px solid #ff4444; border-radius: 8px;
        }

        .reset-btn {
            background: #ff4444; color: white; border: none; padding: 12px 20px;
            font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px;
        }

        .close-settings {
            margin-top: auto; background: var(--theme); color: white; border: none;
            padding: 15px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="room">
        <div class="led-top"></div>
        <div class="led-left"></div>
        <div class="led-right"></div>
        
        <div class="sidebar">
            <div class="header-row">
                <div class="stats">
                    <h2>$<span id="balance">0.00</span></h2>
                </div>
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </div>
            
            <div class="stats">
                <div><strong>Total Rolls:</strong> <span id="totalRolls">0</span></div>
                <div><strong>Heads Chance:</strong> <span id="chanceDisplay">10.0</span>%</div>
                <div><strong>Coin Value:</strong> $<span id="valueDisplay">0.01</span></div>
                <div><strong>Flip Time:</strong> <span id="timeDisplay">3.0</span>s</div>
            </div>
            
            <div class="upgrades">
                <button class="upgrade-btn" onclick="upgradeChance()">Upgrade Chance</button>
                <button class="upgrade-btn" onclick="upgradeValue()">Upgrade Value</button>
                <button class="upgrade-btn" onclick="upgradeTime()">Upgrade Time</button>
            </div>

            <div class="history-container">
                <h3>Roll History</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>

        <div class="table">
            <div class="coin-container">
                <div class="coin" id="coin">
                    <div class="coin-face coin-copper" id="faceFront">H</div>
                    <div class="coin-face coin-back coin-copper" id="faceBack">T</div>
                </div>
            </div>
        </div>

        <div class="btn-wrapper">
            <button class="flip-btn" id="flipBtn" onclick="flipCoin()">FLIP</button>
        </div>

        <div class="settings-modal" id="settingsModal">
            <h1>Settings & Info</h1>
            
            <div class="info-box">
                <strong>Game Goal:</strong> Accumulate $1,000,000 by flipping. Heads generates money. Tails has no value. 
            </div>

            <h2>Theme Color</h2>
            <div class="color-grid">
                <div class="color-swatch" style="background: #8a2be2;" onclick="setTheme('#8a2be2')"></div>
                <div class="color-swatch" style="background: #008B8B;" onclick="setTheme('#008B8B')"></div>
                <div class="color-swatch" style="background: #e63946;" onclick="setTheme('#e63946')"></div>
                <div class="color-swatch" style="background: #4361ee;" onclick="setTheme('#4361ee')"></div>
                <div class="color-swatch" style="background: #2a9d8f;" onclick="setTheme('#2a9d8f')"></div>
                <div class="color-swatch" style="background: #e9c46a;" onclick="setTheme('#e9c46a')"></div>
                <div class="color-swatch" style="background: #f4a261;" onclick="setTheme('#f4a261')"></div>
                <div class="color-swatch" style="background: #ff006e;" onclick="setTheme('#ff006e')"></div>
                <div class="color-swatch" style="background: #aacc00;" onclick="setTheme('#aacc00')"></div>
                <div class="color-swatch" style="background: #ffffff;" onclick="setTheme('#ffffff')"></div>
            </div>

            <div class="danger-zone">
                <h2 style="color: #ff4444; margin-top: 0;">Danger Zone</h2>
                <button class="reset-btn" onclick="resetProgress()">Reset All Progress</button>
            </div>

            <button class="close-settings" onclick="toggleSettings()">Close Settings</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let totalRolls = 0;
        let isFlipping = false;
        let history = [];

        const chanceTiers = [10.0, 12.5, 15.0, 17.5, 20.0, 22.5, 25.0, 27.5, 30.0, 32.5, 35.0, 37.5, 40.0, 42.5, 45.0, 47.5, 50.0, 52.5, 55.0, 57.5, 60.0, 62.5, 65.0, 67.5, 70.0, 72.5, 75.0];
        const valueTiers = [0.01, 0.05, 0.10, 0.25, 0.50, 1, 2, 5, 10, 20, 50, 100];
        const timeTiers = [3.0, 2.9, 2.8, 2.7, 2.6, 2.5, 2.4, 2.3, 2.2, 2.1, 2.0, 1.9, 1.8, 1.7, 1.6, 1.5, 1.4, 1.3, 1.2, 1.1, 1.0];

        let currentChanceIndex = 0;
        let currentValueIndex = 0;
        let currentTimeIndex = 0;

        function setTheme(color) {
            document.documentElement.style.setProperty('--theme', color);
        }

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('open');
        }

        function resetProgress() {
            if(confirm("Are you sure you want to reset ALL progress? This cannot be undone.")) {
                balance = 0;
                totalRolls = 0;
                currentChanceIndex = 0;
                currentValueIndex = 0;
                currentTimeIndex = 0;
                history = [];
                updateUI();
                toggleSettings();
            }
        }

        function updateCoinMaterial() {
            const val = valueTiers[currentValueIndex];
            const faceFront = document.getElementById('faceFront');
            const faceBack = document.getElementById('faceBack');
            
            faceFront.className = "coin-face";
            faceBack.className = "coin-face coin-back";

            if (val >= 1.00) {
                faceFront.classList.add('coin-gold');
                faceBack.classList.add('coin-gold');
            } else if (val >= 0.05) {
                faceFront.classList.add('coin-silver');
                faceBack.classList.add('coin-silver');
            } else {
                faceFront.classList.add('coin-copper');
                faceBack.classList.add('coin-copper');
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('totalRolls').innerText = totalRolls;
            document.getElementById('chanceDisplay').innerText = chanceTiers[currentChanceIndex].toFixed(1);
            document.getElementById('valueDisplay').innerText = valueTiers[currentValueIndex].toFixed(2);
            document.getElementById('timeDisplay').innerText = timeTiers[currentTimeIndex].toFixed(1);
            
            updateCoinMaterial();

            const historyContainer = document.getElementById('historyList');
            historyContainer.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerText = item;
                historyContainer.appendChild(div);
            });
        }

        function addHistory(text) {
            history.unshift(text);
            if (history.length > 10) {
                history.pop();
            }
            updateUI();
        }

        function flipCoin() {
            if (isFlipping) return;
            isFlipping = true;
            
            const coin = document.getElementById('coin');
            const btn = document.getElementById('flipBtn');
            const currentFlipTime = timeTiers[currentTimeIndex] * 1000;
            
            coin.style.animation = `flipAir ${currentFlipTime}ms ease-in-out`;
            btn.style.opacity = '0.5';
            btn.innerText = '...';

            setTimeout(() => {
                const chance = chanceTiers[currentChanceIndex] / 100;
                const isHeads = Math.random() < chance;
                
                coin.style.animation = 'none';
                coin.style.transform = isHeads ? 'rotateX(0deg)' : 'rotateX(180deg)';
                
                btn.style.opacity = '1';
                btn.innerText = 'FLIP';
                isFlipping = false;

                totalRolls++;

                if (isHeads) {
                    const amount = valueTiers[currentValueIndex];
                    balance += amount;
                    addHistory(`Roll ${totalRolls}: Heads (+$${amount.toFixed(2)})`);
                } else {
                    addHistory(`Roll ${totalRolls}: Tails ($0.00)`);
                }

                updateUI();
            }, currentFlipTime);
        }

        function upgradeChance() {
            if (currentChanceIndex < chanceTiers.length - 1) currentChanceIndex++;
            updateUI();
        }

        function upgradeValue() {
            if (currentValueIndex < valueTiers.length - 1) currentValueIndex++;
            updateUI();
        }

        function upgradeTime() {
            if (currentTimeIndex < timeTiers.length - 1) currentTimeIndex++;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
